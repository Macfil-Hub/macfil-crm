<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macfil CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f4;--card:#fff;--ink:#17232d;--mut:#5b6b78;--line:#d6dde2;--acc:#1f5f8b;--warn:#c4571a;--ok:#2f7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#10181e;--card:#18232b;--ink:#e6edf1;--mut:#93a4b1;--line:#2b3a45;--acc:#6fb1de;--warn:#f08a50;--ok:#6cc08b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 6px;flex-wrap:wrap}
header b{font-size:22px;font-weight:700;letter-spacing:.2px}header span{color:var(--mut);font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
nav button{border:0;background:none;color:var(--mut);font:600 15px Barlow,system-ui,sans-serif;padding:12px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{padding:14px 12px 96px;max-width:900px;margin:auto}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:600px){.kpi{grid-template-columns:repeat(4,1fr)}}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:24px;font-weight:700}.kpi small{color:var(--mut)}
.row{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:grid;gap:2px}
.row.late{border-left-color:var(--warn)}.row.win{border-left-color:var(--ok)}
.row b{font-weight:600;word-break:break-all}.row small,.row em{color:var(--mut);font-style:normal;font-size:14px}
.row .l{display:flex;justify-content:space-between;gap:8px}
h2{font-size:17px;margin:18px 0 8px;display:flex;justify-content:space-between}h2 small{color:var(--mut);font-weight:400}
.tools{display:flex;gap:8px;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea{min-height:64px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:600 14px Barlow,system-ui,sans-serif}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border:0;border-radius:28px;padding:14px 22px;font:700 16px Barlow,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:40px 16px}

#modal form{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){#modal{align-items:center}#modal form{border-radius:14px}}
#modal h3{margin:0 0 10px}label{display:block;font-size:14px;color:var(--mut);margin-bottom:10px}label>*{margin-top:4px;color:var(--ink)}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}.btns button{padding:11px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Barlow,system-ui,sans-serif;cursor:pointer}
.btns .pri{background:var(--acc);border-color:var(--acc);color:#fff}.btns .danger{color:var(--warn);margin-right:auto}
.res button{display:block;width:100%;text-align:left;padding:9px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

body{display:block}#app{display:flex;min-height:100vh}
aside{width:208px;flex:none;background:#1e2d3d;color:#cfd8e0;display:flex;flex-direction:column;padding:14px 8px;position:sticky;top:0;height:100vh}
aside .logo{font:700 22px Barlow,system-ui,sans-serif;color:#fff;padding:4px 10px 16px}
aside button{display:flex;gap:10px;align-items:center;background:none;border:0;border-left:3px solid transparent;color:inherit;font:600 15px Barlow,system-ui,sans-serif;padding:11px 10px;border-radius:6px;cursor:pointer;text-align:left}
aside button:hover{background:#2a3c4f}aside button.on{background:#2a3c4f;color:#fff;border-left-color:#ff7a59}
aside i{font-style:normal;width:18px;text-align:center}
aside .me{margin-top:auto;padding:10px;font-size:14px;color:#fff}aside .me small{display:block;color:#9fb0bf}
.shell{flex:1;min-width:0}
.top{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.top h1{font-size:20px;margin:0;flex:none}.top input{max-width:340px;margin-left:auto}
.cta{background:#ff7a59;color:#2a1208;border:0;border-radius:8px;padding:10px 16px;font:700 15px Barlow,system-ui,sans-serif;cursor:pointer;flex:none}
main{max-width:none;padding:16px}
.board{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}
.col{flex:none;width:250px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:140px}
.col.over{outline:2px dashed #ff7a59;background:var(--card)}
.col h4{margin:2px 4px;display:flex;justify-content:space-between;font-size:14px}.col .tot{font-size:13px;color:var(--mut);margin:0 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;cursor:grab;display:grid;gap:3px;font-size:14px}
.card:active{cursor:grabbing}.card b{font-weight:600}.card span,.card small{color:var(--mut)}.card .od{color:var(--warn);font-weight:600}
.card .l{display:flex;justify-content:space-between}.mv{display:none;padding:6px;font-size:13px;margin-top:4px}
@media(pointer:coarse){.mv{display:block}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filters>*{flex:1 1 150px;width:auto}
.tw{overflow-x:auto}.cnt{color:var(--mut);margin:0 0 6px;font-size:14px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
th{cursor:pointer;color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
td.late{color:var(--warn);font-weight:600}
@media(max-width:799px){#app{display:block;padding-bottom:64px}
aside{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:6}
aside .logo,aside .me{display:none}aside button{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;border-left:0;border-top:3px solid transparent;justify-content:center;align-items:center}
aside button.on{border-top-color:#ff7a59}.top input{display:none}.top .cta{margin-left:auto}.col{width:78vw}}
.ph{width:72px;height:72px;object-fit:cover;border-radius:6px;margin:4px 4px 0 0}
.lb{font-size:14px;color:var(--mut);margin-bottom:10px}
.calh{display:flex;align-items:center;gap:6px;margin-bottom:8px}.calh h2{margin:0 auto 0 0;font-size:20px}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:6px}
.wd{font-size:12px;color:var(--mut);text-align:center;font-weight:600}
.cd{min-height:96px;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer;font:inherit;overflow:hidden;min-width:0}
.cd b{font-size:13px;align-self:flex-start;padding:0 6px;border-radius:10px}.cd.ot{opacity:.45}.cd.td b{background:var(--acc);color:#fff}.cd.on{outline:2px solid var(--acc);outline-offset:-2px}
.ev{display:block;font-style:normal;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;padding:1px 4px;background:rgba(31,95,139,.13)}
.ev.rm{background:rgba(196,87,26,.16)}.ev.ci{background:rgba(120,80,170,.16)}
.lr{margin-bottom:12px}.lr .l{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}.lr b{white-space:nowrap}.ev.fq{background:rgba(47,125,79,.15)}.ev.dn{opacity:.6;text-decoration:line-through}
.cd small{font-size:10px;color:var(--mut)}.dots{display:none;font-style:normal;color:var(--acc);font-size:15px;line-height:1;letter-spacing:1px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:8;width:max-content;max-width:calc(100% - 24px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#toast[hidden]{display:none}
@media(max-width:799px){.cd{min-height:54px;align-items:center;padding:4px 2px}.cd b{align-self:center}.cd .ev,.cd small{display:none}.dots{display:block}}
.pk{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}.pk label{position:relative;margin:0;padding:10px 14px;font-size:15px;color:var(--ink);cursor:pointer}
.pk input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.pv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pt{position:relative}.pt img{width:72px;height:72px;object-fit:cover;border-radius:6px;display:block;background:var(--line)}
.pt button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--warn);color:#fff;font-size:16px;line-height:1;padding:0;cursor:pointer}td select,td input{padding:4px 6px;font-size:13px;width:auto;min-width:90px}.lg{max-width:380px;margin:10vh auto;padding:24px;display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;width:calc(100% - 32px)}.lg h1{margin:0 0 4px}.lg a{color:var(--acc);font-size:14px}.so{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;flex:none}.empty a{color:var(--acc)}
/* Career development */
.pn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}.pn>h2:first-child{margin-top:0}.pn.warn{border-color:var(--warn)}.pn.hi{border-color:#ff7a59}
.g2{display:grid;gap:0 12px}@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}.hd h2{margin:0;font-size:22px}.hd .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sb{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Barlow,system-ui,sans-serif;cursor:pointer}
.bdg{font-size:13px;font-weight:700;padding:3px 10px;border:1px solid;border-radius:6px;white-space:nowrap}.r-ready{color:var(--ok)}.r-developing{color:var(--acc)}.r-early{color:var(--mut)}.r-risk{color:var(--warn)}
.tag{font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--mut);padding:0 5px;border-radius:4px;margin-left:6px}
.gz{display:block;width:100%;text-align:left;background:none;border:0;padding:0;margin:0 0 12px;color:inherit;font:inherit}.gz[data-ck]{cursor:pointer}.gz[data-ck]:hover .gl{text-decoration:underline}
.gz .l{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}.gz .gl{color:var(--mut)}.gz b{font-weight:700;white-space:nowrap}.gz b small{color:var(--mut);font-weight:400}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#ff7a59}.bar i.ok{background:var(--ok)}
.up{color:var(--ok);font-size:12px}.dn{color:var(--warn);font-size:12px}
.ck{display:flex;gap:8px;padding:3px 0;color:var(--mut)}.ck.ok{color:var(--ink)}.ck.ok b{color:var(--ok)}
.nx{background:var(--bg);border-left:4px solid #ff7a59;padding:8px 12px;border-radius:4px;margin-top:8px;font-size:14px}.nx ul{margin:4px 0 0;padding-left:18px}
.rail{display:flex;gap:4px}.rail div{flex:1;text-align:center;font-size:13px;color:var(--mut);border-top:4px solid var(--line);padding-top:6px}.rail .p{border-color:var(--mut)}.rail .c{border-color:#ff7a59;color:var(--ink);font-weight:700}
.tr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.tr:last-child{border-bottom:0}.tr span{flex:1;min-width:140px}.tr small{color:var(--mut)}.tr select,.tr input{width:auto;padding:5px 8px;font-size:14px}
.act{margin-top:4px;padding:5px 8px;border-left:3px solid var(--acc);background:var(--bg);border-radius:4px;font-size:14px}.act.late{border-left-color:var(--warn)}.act.done{border-left-color:var(--ok);color:var(--mut)}
.lnk{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.kpi div.late b{color:var(--warn)}
@media print{aside,.top,.sb,.cta,.lnk,#modal{display:none!important}#app{display:block}main{padding:0}.pn{break-inside:avoid}}
</style></head>
<body><div id="app"><p class="empty">Loading…</p></div><div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
const CFG={url:'https://bkadjtlwkcfpjoxuvmrg.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrYWRqdGx3a2NmcGpveHV2bXJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNzA1NzgsImV4cCI6MjEwODc0NjU3OH0.Opuohzr4OQnXjwQe64_3Ih7H62gOa59CT4iqjQm7_SU'};
const SB=CFG.url.startsWith('PASTE')?null:supabase.createClient(CFG.url,CFG.key);
const run=async p=>{const{error}=await p;if(error)throw error};
const col=n=>({
  doc:id=>({
    set:d=>run(SB.from(n).upsert({id,data:d})),
    update:async d=>{const{data:r,error}=await SB.from(n).select('data').eq('id',id).single();if(error)throw error;return run(SB.from(n).update({data:{...r.data,...d}}).eq('id',id))},
    delete:()=>run(SB.from(n).delete().eq('id',id)),
    get:async()=>{const{data}=await SB.from(n).select('id').eq('id',id).maybeSingle();return{exists:!!data}}
  }),
  onSnapshot:cb=>{const load=async()=>{const{data,error}=await SB.from(n).select('id,data');if(!error)cb({docs:data.map(r=>({id:r.id,data:()=>r.data}))})};load();SB.channel('ch-'+n).on('postgres_changes',{event:'*',schema:'public',table:n},load).subscribe()}
});
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Quote status: the same list as the Status column in Macfil Quotation Summary.xlsx
const ST=['On Going','Quoted','To Revise','Closed','Win','Lost','Declined'];
const OPEN=['On Going','Quoted','To Revise'],PIPE=[...OPEN,'Win'];
// Product codes and the common brands, as used in the Quotation Summary Excel. Brand still accepts a rare make typed in.
const PROD=[['BC','BC – Brook Crompton'],['SP','SP – Sulzer'],['GN','GN – General / other brands'],['NW','NW – Neway']];
const BRANDS=['Brook','Sulzer','Service','WEG','SEW','GPA','Innomotics','ABB','Neway','Grundfos','MIM','Sumitomo','Siemens','Nord','Regent','Hyosung'];
const PBRAND={BC:'Brook',SP:'Sulzer',NW:'Neway'};
const normBrand=b=>{b=(b||'').trim().replace(/\s+/g,' ');if(/^brook\s*crompton$/i.test(b))return 'Brook';return BRANDS.find(x=>x.toLowerCase()===b.toLowerCase())||b};
const NEEDPRICE=['Quoted','To Revise','Win'];
// Why a quote ended without an order; feeds "Why deals were lost" in Career.
const LOSTST=['Closed','Lost','Declined'];
const LOSTR=['Price','Technical scope','Slow response','Delivery time','Competitor brand','Customer cancelled','Other'];
const LOSTHINT={'Price':'Negotiation and pricing coaching; check margin before quoting','Technical scope':'Product training: Motor fundamentals, Motor servicing, Pump & mixer basics','Slow response':'Sales activities practices: quote and follow up faster','Delivery time':'Check stock and supplier lead times at enquiry stage','Competitor brand':'Product comparison and value selling','Customer cancelled':'Outside our control; keep in touch for the next project','Other':'Read the reason details on each quote','Not recorded':'Record a reason whenever a quote is Lost, Declined or Closed'};
// Totals keep RM and USD apart instead of adding them together.
const money=l=>{const t=c=>l.filter(q=>(q.curr||'RM').trim()===c).reduce((a,q)=>a+(q.price||0),0),u=t('USD');return 'RM '+fmt(t('RM'))+(u?' + USD '+fmt(u):'')};
const ORD=['','Order placed','Delivered','Invoiced','Paid'];
const RL={manager:'Manager',finance:'Finance',support:'Sales support',sales:'Sales / AE'};
const S={tab:'fu',staff:{},quotes:[],custs:[],visits:[],vs:'up',scope:'mine',q:'',fl:{status:'',owner:'',product:''},sort:{k:'seq',d:-1},career:{},cset:null,cOK:false,cp:null};
let DB,U,UID;
const today=()=>ld();
const my=()=>S.staff[UID];
const seeAll=()=>['manager','finance','support'].includes(my().role);
const canEdit=()=>my().role!=='finance';
const isAdmin=()=>my().admin===true;
const mine=q=>q.sales===my().ini||q.ae===my().ini;
const visible=()=>S.quotes.filter(q=>seeAll()||mine(q));
const fmt=n=>Number(n||0).toLocaleString('en-MY');
const qno=q=>`MF26-${q.seq}-${q.product||'NA'}-${q.sales||'NA'}-${q.ae||'NA'}${q.rev>0?'-R'+q.rev:''}`;
// Quotes saved before the Status field kept a stage and an outcome; read those as the matching status.
const st=q=>ST.includes(q.status)?q.status:({Lost:'Lost',Declined:'Declined',Cancelled:'Closed'}[q.outcome]||({'Quoted':'Quoted','Revision and negotiation':'To Revise','Won (PO received)':'Win'}[q.stage])||'On Going');
const oc=q=>PIPE.includes(st(q))?'Open':st(q);
const win=q=>st(q)==='Win';
const pre=q=>OPEN.includes(st(q));
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ld(d)};
const vvis=()=>S.visits.filter(v=>seeAll()||v.owner===my().ini);
const msg=t=>{$('#app').innerHTML=`<p class="empty">${t}</p>`};

async function init(){
  if(CFG.url.startsWith('PASTE'))return msg('Setup not finished: paste your Supabase URL and key into this file (see the setup guide).');
  const{data:{session}}=await SB.auth.getSession();
  if(!session)return login('in');
  DB={collection:col};UID=session.user.id;
  DB.collection('staff').onSnapshot(async s=>{
    S.staff={};s.docs.forEach(d=>S.staff[d.id]=d.data());
    if(!S.staff[UID]&&false){
      const m=await U.me();
      const ini=m.name.split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();
      await DB.collection('staff').doc(UID).set({name:m.name,ini,role:'manager',admin:true,active:true});return}
    render()});
  DB.collection('quotes').onSnapshot(s=>{S.quotes=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  DB.collection('customers').onSnapshot(s=>{S.custs=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  DB.collection('visits').onSnapshot(s=>{S.visits=s.docs.map(d=>({id:d.id,...d.data()}));render();remCheck()});
  DB.collection('career').onSnapshot(s=>{S.career={};S.cOK=true;s.docs.forEach(d=>S.career[d.id]=d.data());render()});
  DB.collection('career_settings').onSnapshot(s=>{const m=s.docs.find(d=>d.id==='main');S.cset=m?m.data():null;render()});
}

function qrow(q){
  const late=pre(q)&&q.next&&q.next<today();

  const fm=el.firstChild;

  $('#x').onclick=()=>{el.hidden=true};

  fm.onsubmit=async e=>{e.preventDefault();try{await save(Object.fromEntries(new FormData(fm)));el.hidden=true}catch(x){alert('Could not save: '+(x.message||x))}};

}

/* ---------- Sales career development (see setup_career.sql) ----------
   Career records live in the `career` table, one row per staff member in the programme.
   KPIs are worked out live from quotes, customers and activities, so nobody types them in. */
const LV=['Junior Sales Executive','Sales Executive','Senior Sales Executive','Assistant Sales Manager'];
const MET={quotes:{l:'Quotes issued / month',u:''},conv:{l:'Quote-to-order rate, 90 days',u:'%'},accounts:{l:'New customers / quarter',u:''},value:{l:'Orders won / month (RM)',u:''},repeat:{l:'Won value from repeat customers, 12 months',u:'%'},visits:{l:'Activities completed / month',u:''},certs:{l:'Product certification modules',u:'',mgr:1}};
// Starting values only; managers change them under Career > Programme settings.
const CDEF={kpi:{0:{quotes:20,conv:25,accounts:3,certs:6},1:{value:45000,conv:30,repeat:40,certs:9},2:{value:70000,conv:33,visits:12,certs:12},3:{value:120000,conv:30,visits:10,certs:14}},
  training:{0:['Motor fundamentals','Motor servicing fundamentals','Sales activities practices','Pump & mixer basics'],1:['Advanced Sulzer product range','Key account management','Contract & terms review'],2:['Tender & bid preparation','Pricing & margin management','Coaching & mentoring'],3:['People management basics','Sales forecasting & pipeline review','Performance review conversations']},
  range:{0:[12,18],1:[18,30],2:[24,36],3:[24,48]}};
const RD={ready:'Ready',developing:'Developing',early:'Early stage'};
const RDN={ready:'Recommended to the MD for promotion, expanded duties or a salary review.',developing:'Gaps and actions agreed; reviewed again next quarter.',early:'Coaching plan, followed up at each monthly check-in.'};
const NT=['Monthly check-in','Coaching','Quarterly review feedback','Onboarding','Other'];
const REC={none:'No change, continue development',promotion:'Promotion',duties:'Expanded duties',salary:'Salary review'};
const MD={na:'Not needed',pending:'Pending MD',approved:'Approved by MD',declined:'Declined by MD'};
const TS={'not-started':'Not started','in-progress':'In progress',done:'Complete'};
const ONB=[['ladder','Week 1','Walked through the career ladder, what the next level needs, and the KPIs'],['crm','Week 1–2','CRM account active, initials set, first quotes logged'],['targets','Week 2','Starting targets agreed together'],['training','Week 3–4','Training plan assigned, assessment dates agreed'],['first','Day 30','First feedback note logged, monthly check-in date set']];
const isMgr=()=>my()?.role==='manager';
const ld=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd=s=>{if(!s)return null;const[y,m,d]=String(s).split('-').map(Number);return y?new Date(y,(m||1)-1,d||1):null};
const dsince=s=>{const d=pd(s);return d?Math.round((pd(ld())-d)/864e5):Infinity};
const dplus=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ld(d)};
const fd=s=>{const d=pd(s);return d?d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):''};
const qof=s=>{const d=pd(s);return d.getFullYear()+' Q'+(Math.floor(d.getMonth()/3)+1)};
const qend=s=>{const d=pd(s);return ld(new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3+3,0))};
const cuid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function cs(){const x=S.cset||{},o={kpi:{},training:{},range:{}};LV.forEach((_,i)=>{o.kpi[i]=x.kpi?.[i]||CDEF.kpi[i];o.training[i]=x.training?.[i]||CDEF.training[i];o.range[i]=x.range?.[i]||CDEF.range[i]});return o}
const lvOf=c=>Math.min(LV.length-1,Math.max(0,Number(c.level)||0));
const mir=c=>{const s=pd(c.start);if(!s)return 0;const t=new Date();let m=(t.getFullYear()-s.getFullYear())*12+t.getMonth()-s.getMonth();if(t.getDate()<s.getDate())m--;return Math.max(0,m)};
const rangeOf=c=>c.range||cs().range[lvOf(c)];
// Customers saved before this change have no created date; their id holds the time they were added.
const custDate=c=>{if(c.created)return c.created;if(!/^c[0-9a-z]+$/.test(c.id||''))return'';const d=new Date(parseInt(c.id.slice(1),36));return isNaN(d)?'':ld(d)};

// One KPI for one person (by initials). off=1 gives the previous period, for the change arrows.
function crmKpi(ini,k,off=0){
  const t=new Date(),mine=S.quotes.filter(q=>q.sales===ini||q.ae===ini),dec=q=>win(q)||['Lost','Declined'].includes(oc(q)),wd=q=>q.won||q.date||'';
  const mS=ld(new Date(t.getFullYear(),t.getMonth()-off,1)),mE=ld(new Date(t.getFullYear(),t.getMonth()-off+1,0)),inM=s=>!!s&&s>=mS&&s<=mE;
  if(k==='quotes'){const l=mine.filter(q=>inM(q.date));return{v:l.length,q:l,w:'Quotes dated this month where you are Sales or AE'}}
  if(k==='value'){const l=mine.filter(q=>win(q)&&inM(wd(q)));return{v:l.reduce((a,q)=>a+(q.price||0),0),q:l,w:'Quotes marked Win this month'}}
  if(k==='conv'){const to=ld(new Date(t.getFullYear(),t.getMonth(),t.getDate()-30*off)),fr=dplus(to,-90),l=mine.filter(q=>q.date>=fr&&q.date<=to&&dec(q)),w=l.filter(win).length;
    return{v:l.length?Math.round(w/l.length*100):0,q:l,won:w,dec:l.length,w:`${w} won out of ${l.length} decided quotes (won, lost or declined) dated in the last 90 days`}}
  if(k==='accounts'){const m0=Math.floor(t.getMonth()/3)*3-3*off,a=ld(new Date(t.getFullYear(),m0,1)),b=ld(new Date(t.getFullYear(),m0+3,0));
    const l=S.custs.filter(c=>{const d=custDate(c);return d>=a&&d<=b}).map(c=>S.quotes.filter(q=>q.customer===c.name).sort((x,y)=>x.seq-y.seq)[0]).filter(q=>q&&(q.sales===ini||q.ae===ini));
    return{v:l.length,q:l,w:'Customers added to the CRM this quarter whose first quote is yours'}}
  if(k==='repeat'){const to=dplus(ld(),-30*off),fr=dplus(to,-365),l=mine.filter(q=>win(q)&&wd(q)>=fr&&wd(q)<=to);
    const rep=l.filter(q=>S.quotes.some(o=>o.id!==q.id&&o.customer===q.customer&&win(o)&&wd(o)<wd(q))),tot=l.reduce((a,q)=>a+(q.price||0),0);
    return{v:tot?Math.round(rep.reduce((a,q)=>a+(q.price||0),0)/tot*100):0,q:rep,w:'Won value from customers who had ordered before, over the last 12 months'}}
  if(k==='visits'){const l=S.visits.filter(v=>v.owner===ini&&v.status==='Done'&&inM(v.date));return{v:l.length,a:l,w:'Activities marked Done this month'}}
  return{v:0,q:[],w:''}}
function kRows(id){const c=S.career[id],ini=S.staff[id]?.ini||'',T=cs().kpi[lvOf(c)];
  return Object.entries(T).map(([k,t])=>{const m=MET[k]||{l:k,u:''},o=c.targets?.[k],own=o!=null&&o!=='',tg=own?Number(o):Number(t);
    if(m.mgr)return{k,...m,t:tg,own,v:Number(c.certs)||0,prev:null};
    const r=crmKpi(ini,k);return{k,...m,t:tg,own,v:r.v,prev:crmKpi(ini,k,1).v,r}})}
const tRows=id=>{const c=S.career[id];return cs().training[lvOf(c)].map(n=>({n,s:c.training?.[n]||'not-started',a:c.assess?.[n]||''}))};
const hit=id=>{const r=kRows(id);return r.length?r.filter(x=>x.v>=x.t).length/r.length:0};
const trn=id=>{const r=tRows(id);return r.length?r.filter(x=>x.s==='done').length/r.length:0};
const lastRev=c=>[...(c.notes||[]),...(c.reviews||[])].map(x=>x.date).filter(Boolean).sort().pop()||null;
const recent=c=>dsince(lastRev(c))<=92;
const cstat=id=>{const h=hit(id),t=trn(id);return h>=.75&&t===1&&recent(S.career[id])?'ready':h>=.5&&t>=.5?'developing':'early'};
const crisk=id=>{const c=S.career[id];return mir(c)>rangeOf(c)[1]&&!recent(c)};
// A booked check-in lives on the career record (so the salesperson sees it) and as a Check-in activity in the manager's calendar.
const booked=c=>c.checkin&&c.checkin.date>=ld()?c.checkin:null;
const nextCk=c=>{const b=booked(c),lr=lastRev(c);return b?{d:b.date,t:b.time,by:b.by,bk:true}:{d:lr?dplus(lr,30):null,bk:false}};
const ckTxt=ck=>ck.bk?fd(ck.d)+(ck.t?' '+ck.t:''):ck.d?fd(ck.d)+' (not booked)':'Not booked';
// Why deals were lost: Closed, Lost and Declined quotes dated in the last 90 days, grouped by reason.
function lostPanel(l,title){const fr=dplus(ld(),-90),x=l.filter(q=>LOSTST.includes(st(q))&&(q.date||'')>=fr),g={};
  x.forEach(q=>{const k=q.why||'Not recorded';(g[k]=g[k]||[]).push(q)});const rows=Object.entries(g).sort((a,b)=>b[1].length-a[1].length),mx=rows[0]?.[1].length||1;

  modal((b?'Change check-in: ':'Book check-in: ')+E(p.name),[{k:'date',l:'Date',t:'date'},{k:'time',l:'Time',t:'time'},{k:'remind',l:'Reminder alert',t:'select',o:REM},{k:'notes',l:'Agenda (optional)',t:'area'}],v,
    async d=>{if(!d.date||!d.time)throw Error('Set a date and a time.');if(d.date<ld())throw Error('Pick today or a later date.');
      const V=DB.collection('visits'),old=b?.vid&&S.visits.some(x=>x.id===b.vid),vid=old?b.vid:'v'+Date.now().toString(36);
      const a={type:'Check-in',purpose:'Career check-in: '+p.name,customer:'',date:d.date,time:d.time,remind:d.remind,notes:d.notes.trim(),status:'Planned',owner:my().ini,careerOf:id};

function steps(id){const c=S.career[id],ini=S.staff[id]?.ini,rows=kRows(id),need=Math.ceil(rows.length*.75),miss=rows.filter(r=>r.v<r.t),o=[];
  if(rows.length-miss.length<need){const n=need-(rows.length-miss.length);o.push(`Meet ${n} more KPI target${n>1?'s':''} (closest: ${[...miss].sort((a,b)=>b.v/(b.t||1)-a.v/(a.t||1)).slice(0,n+1).map(r=>r.l).join(', ')})`)}
  const cv=miss.find(r=>r.k==='conv');
  if(cv&&cv.t<100){const T=cv.t/100,x=Math.max(1,Math.ceil((T*cv.r.dec-cv.r.won)/(1-T))),op=S.quotes.filter(q=>(q.sales===ini||q.ae===ini)&&pre(q)).length;o.push(`To lift conversion to ${cv.t}%: win about ${x} more quote${x>1?'s':''} (${op} open now)`)}
  const op=tRows(id).filter(t=>t.s!=='done');if(op.length)o.push('Pass the assessment for: '+op.map(t=>t.n).join(', '));
  if(!recent(c))o.push('Book a manager review conversation');return o}

document.addEventListener('drop',e=>{const c=e.target.closest('.col');if(!c||!dragId)return;e.preventDefault();moveQ(dragId,c.dataset.stage);dragId=null});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.mv)moveQ(d.mv,e.target.value);else if(d.ed){const[id,fl]=d.ed.split(':'),val=fl==='price'?Number(e.target.value)||0:e.target.value;if(fl==='status')moveQ(id,val);else DB.collection('quotes').doc(id).update({[fl]:val}).catch(x=>alert('Could not save: '+(x.message||x)))}
  else if(d.fl){S.fl[d.fl]=e.target.value;$('#list').innerHTML=qlist()}});
document.addEventListener('keydown',e=>{if(e.target.id==='gs'&&e.key==='Enter'){S.q=e.target.value;S.tab='qt';render()}});
function login(mode){
  const up=mode==='up';
  $('#app').innerHTML=`<form id="lg" class="lg"><h1>Macfil CRM</h1>${up?'<input name="nm" placeholder="Full name" required>':''}<input name="em" type="email" placeholder="Work email" required autocomplete="username"><input name="pw" type="password" placeholder="Password (at least 8 characters)" required minlength="8" autocomplete="${up?'new-password':'current-password'}"><button class="cta">${up?'Create account':'Sign in'}</button><p class="cnt" id="lm"></p><a href="#" id="sw">${up?'Already have an account? Sign in':'New staff? Create an account'}</a><a href="#" id="fp">Forgot password</a></form>`;
  const f=$('#lg'),m=$('#lm');
  $('#sw').onclick=e=>{e.preventDefault();login(up?'in':'up')};
  $('#fp').onclick=async e=>{e.preventDefault();if(!f.em.value)return m.textContent='Type your email first.';const r=await SB.auth.resetPasswordForEmail(f.em.value,{redirectTo:location.origin+location.pathname});m.textContent=r.error?r.error.message:'Password reset email sent.'};
  f.onsubmit=async e=>{e.preventDefault();m.textContent='Please wait…';
    const r=up?await SB.auth.signUp({email:f.em.value,password:f.pw.value,options:{data:{name:f.nm.value},emailRedirectTo:location.origin+location.pathname}}):await SB.auth.signInWithPassword({email:f.em.value,password:f.pw.value});
    if(r.error)return m.textContent=r.error.message;
    if(up&&!r.data.session)return m.textContent='Check your email and click the confirmation link, then sign in.';
    location.reload()};
}
SB?.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){const p=prompt('Type your new password (at least 8 characters)');if(p)SB.auth.updateUser({password:p}).then(r=>alert(r.error?r.error.message:'Password updated.'))}});
init();
</script></body></html>
